name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: agent-android
            asset_name: agent-android-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: agent-android.exe
            asset_name: agent-android-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: agent-android
            asset_name: agent-android-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: agent-android
            asset_name: agent-android-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: .
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p release_assets
          
          SRC="./target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          BINARY_NAME="${{ matrix.artifact_name }}"
          ASSET_NAME="${{ matrix.asset_name }}"
          
          # Remove .exe from asset name for the zip filename if present
          ZIP_NAME="${ASSET_NAME%.exe}.zip"
          
          STAGING_DIR="staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          
          cp "$SRC" "$STAGING_DIR/$BINARY_NAME"
          
          cd "$STAGING_DIR"
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Use 7z to create a standard zip file on Windows
            7z a -tzip "../release_assets/$ZIP_NAME" "$BINARY_NAME"
          else
            zip "../release_assets/$ZIP_NAME" "$BINARY_NAME"
          fi

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*.zip
